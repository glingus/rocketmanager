# Configurazione del progetto Supabase CLI (https://supabase.com/docs/guides/local-development/cli/config).
# Usata da `supabase start` (sviluppo locale con Docker) e `supabase link/db push/functions deploy`.
project_id = "rocket-sync"

[api]
enabled = true
port = 54321
# `private` NON è esposto: contiene webhook Discord e coda dei messaggi.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:1420"
additional_redirect_urls = ["http://127.0.0.1:1420", "http://localhost:1420", "rocketsync://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Accesso con GitHub (OAuth). I valori arrivano dall'ambiente, mai dal repository.
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"

# ---- Edge Functions -------------------------------------------------------------------------
# verify_jwt = false solo dove l'autenticazione è un'altra: la firma HMAC di GitHub
# (github-webhook) e la chiave service_role confrontata dalla funzione (discord-dispatch, chiamata
# da pg_cron).
[functions.create-project]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.manage-members]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.accept-invitations]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.github-webhook]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.discord-settings]
verify_jwt = true
import_map = "./functions/deno.json"

[functions.discord-dispatch]
verify_jwt = false
import_map = "./functions/deno.json"

[functions.github-token-refresh]
verify_jwt = true
import_map = "./functions/deno.json"
