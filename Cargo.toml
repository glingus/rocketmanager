[workspace]
resolver = "2"
members = [
    "crates/rs-git",
    "crates/rs-store",
    "crates/rs-core",
    "crates/rs-ork",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.80"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
