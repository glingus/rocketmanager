[package]
name = "rocket-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Rocket Sync - sincronizzazione dei file OpenRocket per il team"
default-run = "rocket-sync"

[lib]
name = "rocket_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rocket-sync"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rs-core = { path = "../../../crates/rs-core" }
rs-git = { path = "../../../crates/rs-git" }
rs-store = { path = "../../../crates/rs-store" }
rs-ork = { path = "../../../crates/rs-ork" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
similar = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
# No native secret service in the development builds: `keyring` falls back to its in-process mock store.
keyring = "3"

[dev-dependencies]
tempfile = "3"
