[package]
name = "rs-ork"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Parser, semantic diff and changelog generator for OpenRocket (.ork) files"

[lib]
name = "rs_ork"
path = "src/lib.rs"

[[bin]]
name = "ork-cli"
path = "src/bin/ork-cli.rs"

[dependencies]
flate2 = "1.1"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9.7", default-features = false, features = ["deflate"] }
